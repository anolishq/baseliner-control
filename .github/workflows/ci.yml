name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same pinned install as the scan workflow (which runs with BASELINER_TOKEN): the
      # archive must match the SHA-256 below and carry build provenance from
      # baseliner's release workflow at VERSION. Bump VERSION and SHA256
      # together, taking the hash from the release's checksums.txt.
      - name: Install baseliner
        env:
          VERSION: v0.4.0
          SHA256: 21c7af860a2f3c531f5185b5ab4906bd444e2c2b089c5e9113b73bba4d3ad737 # baseliner_linux_amd64.tar.gz
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=baseliner_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/baselinerhq/baseliner/releases/download/$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          gh attestation verify "$RUNNER_TEMP/$archive" --repo baselinerhq/baseliner \
            --signer-workflow baselinerhq/baseliner/.github/workflows/release.yml \
            --source-ref "refs/tags/$VERSION" --deny-self-hosted-runners
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" baseliner
          install -D -m 0755 "$RUNNER_TEMP/baseliner" "$HOME/.local/bin/baseliner"

      - name: Validate baseliner.yaml resolves
        # `policy` resolves policy.base + repo_ignores from the local config
        # only (no org scan, no token), so it fails fast on a malformed or
        # invalid policy file.
        run: |
          "$HOME/.local/bin/baseliner" policy --config baseliner.yaml

      - name: Validate renovate.json is well-formed
        run: python3 -c "import json,sys; json.load(open('renovate.json'))"

  ok:
    name: ok
    if: always()
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
