name: baseliner

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install baseliner
        run: curl -fsSL https://raw.githubusercontent.com/baselinerhq/baseliner/main/scripts/install.sh | bash
        env:
          VERSION: v0.2.8 # pinned: reproducible + skips the latest-release API lookup

      # Monitor mode: findings go to each repo as a findings issue, so they do
      # not fail this run. --fail-under 0 passes any assessed repo, and
      # --min-coverage 1.0 fails a repo whose evidence could not be read. A
      # red run therefore means the scan itself broke.
      - name: Run baseliner
        run: |
          "$HOME/.local/bin/baseliner" scan \
            --config baseliner.yaml \
            --output-file results.json \
            --open-issues \
            --fail-under 0 \
            --min-coverage 1.0 \
            --format both
        env:
          GITHUB_TOKEN: ${{ secrets.BASELINER_TOKEN }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseliner-results
          path: results.json
          if-no-files-found: warn

  # GitHub disables a public repo's scheduled workflows after 60 days without
  # repository activity, and neither these runs nor the findings issues they
  # write count. Re-enabling this (still active) workflow on each run restarts
  # that clock. It is a separate job so the scan keeps a read-only token.
  # See https://baselinerhq.github.io/control-repo#keeping-the-schedule-alive.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/baseliner.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
